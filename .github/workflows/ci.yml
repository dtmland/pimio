name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      failing_selftest:
        description: >-
          Build with the deliberately failing CTest self-test enabled to prove
          that every platform job reports failures.
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned Qt release for the product. See docs/supported-platforms.md.
  PIMIO_QT_VERSION: 6.8.3
  # Pinned LORE release. Must match PIMIO_LORE_VERSION in cmake/PimioLore.cmake;
  # it is repeated here only so the download cache can be keyed by it.
  PIMIO_LORE_VERSION: 0.8.5

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux native dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ninja-build \
            xvfb

      - name: Install Ninja (Windows and macOS)
        if: matrix.name != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt ${{ env.PIMIO_QT_VERSION }}
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.PIMIO_QT_VERSION }}
          cache: true
          cache-key-prefix: qt-multimedia-imageformats-${{ matrix.runner }}-${{ env.PIMIO_QT_VERSION }}
          modules: qtmultimedia qtimageformats
          extra: --base https://download.qt.io

      - name: Cache LORE ${{ env.PIMIO_LORE_VERSION }}
        uses: actions/cache@v4
        with:
          path: .cache/lore
          key: lore-${{ matrix.runner }}-${{ env.PIMIO_LORE_VERSION }}

      - name: Enable MSVC developer environment
        if: matrix.name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # LORE is required here even though it is optional locally: a job that
      # quietly skipped the durable-store tests would report green without
      # having run the evidence the increment depends on.
      - name: Configure
        run: >-
          cmake --preset default
          -DPIMIO_REQUIRE_LORE=ON
          -DPIMIO_ENABLE_FAILING_SELFTEST=${{ inputs.failing_selftest && 'ON' || 'OFF' }}

      - name: Report the acquired LORE version
        run: cmake -E cat build/default/lore-acquired.txt

      - name: Build
        run: cmake --build --preset default

      - name: Test (offscreen)
        run: >-
          ctest --preset default --output-on-failure --verbose
          --output-junit "${{ github.workspace }}/build/default/test-results/ctest-offscreen.xml"

      - name: Test (X11 via Xvfb)
        if: matrix.name == 'Linux'
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24"
          ctest --preset default-x11
          --output-junit "${{ github.workspace }}/build/default/test-results/ctest-xvfb.xml"

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: |
            build/default/test-results/
            build/default/Testing/
          if-no-files-found: warn
          retention-days: 14
