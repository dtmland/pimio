name: Release

on:
  push:
    tags:
      - v*
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            archive: tar.gz
          - name: Windows
            runner: windows-2025
            archive: zip
          - name: macOS
            runner: macos-15
            archive: tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux native dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ninja-build \
            patchelf   # needed by cmake --install to rewrite ELF RPATH for the Qt deployment

      - name: Install Ninja (Windows and macOS)
        if: matrix.name != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.8.3
          cache: true
          cache-key-prefix: qt-${{ matrix.runner }}-6.8.3
          extra: --base https://download.qt.io

      - name: Cache LORE 0.8.5
        uses: actions/cache@v4
        with:
          path: .cache/lore
          key: lore-${{ matrix.runner }}-0.8.5

      - name: Enable MSVC developer environment
        if: matrix.name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >-
          cmake --preset default
          -DPIMIO_REQUIRE_LORE=ON
          -DPIMIO_BUILD_TESTS=OFF

      - name: Build app
        run: cmake --build --preset default --target pimio_app

      - name: Stage deployment
        run: >-
          cmake --install build/default
          --prefix "${{ github.workspace }}/deploy"

      - name: Copy LORE library to deployment (Linux)
        if: matrix.name == 'Linux'
        run: |
          LORE_LIB=$(sed -n 's/^library=//p' build/default/lore-acquired.txt)
          [ -n "$LORE_LIB" ] && cp "$LORE_LIB" deploy/bin/

      - name: Copy LORE library to deployment (macOS)
        if: matrix.name == 'macOS'
        run: |
          LORE_LIB=$(sed -n 's/^library=//p' build/default/lore-acquired.txt)
          [ -n "$LORE_LIB" ] && cp "$LORE_LIB" deploy/pimio.app/Contents/MacOS/

      - name: Copy LORE library to deployment (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $lorePath = (Get-Content build/default/lore-acquired.txt |
            Where-Object { $_ -match '^library=' }) -replace '^library=', ''
          if ($lorePath) { Copy-Item $lorePath deploy/bin/ }

      - name: Archive deployment (Linux and macOS)
        if: matrix.archive == 'tar.gz'
        run: >-
          tar -C deploy -czf
          "pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.tar.gz"
          .

      - name: Archive deployment (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archiveDir = Join-Path $env:RUNNER_TEMP ("pimio-archive-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path $archiveDir) { Remove-Item -Path $archiveDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $archiveDir
          Copy-Item -Path deploy/bin/* -Destination $archiveDir -Recurse -Force
          Get-ChildItem deploy | Where-Object { $_.Name -ne 'bin' } | ForEach-Object { Copy-Item -Path $_.FullName -Destination $archiveDir -Recurse -Force }
          Compress-Archive -Path "$archiveDir/*" -DestinationPath pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.zip

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-archive-${{ matrix.name }}
          path: pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          path: .
          pattern: binary-archive-*
          merge-multiple: true

      - name: Create source snapshot asset
        run: >-
          git archive
          --format=tar.gz
          --output "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
          "${{ github.ref_name }}"

      - name: Create release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --generate-notes \
              --title "${{ github.ref_name }}" \
              --prerelease
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          --clobber
          "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
          "pimio-${{ github.ref_name }}-Linux-binaries.tar.gz"
          "pimio-${{ github.ref_name }}-Windows-binaries.zip"
          "pimio-${{ github.ref_name }}-macOS-binaries.tar.gz"
