name: Release

on:
  push:
    tags:
      - v*
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build binaries (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            archive: tar.gz
          - name: Windows
            runner: windows-2025
            archive: zip
          - name: macOS
            runner: macos-15
            archive: tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux native dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libegl1 \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            ninja-build \
            patchelf   # needed by cmake --install to rewrite ELF RPATH for the Qt deployment

      - name: Install Ninja (Windows and macOS)
        if: matrix.name != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: 6.8.3
          cache: true
          cache-key-prefix: qt-${{ matrix.runner }}-6.8.3
          extra: --base https://download.qt.io

      - name: Cache LORE 0.8.5
        uses: actions/cache@v4
        with:
          path: .cache/lore
          key: lore-${{ matrix.runner }}-0.8.5

      - name: Enable MSVC developer environment
        if: matrix.name == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >-
          cmake --preset default
          -DPIMIO_REQUIRE_LORE=ON
          -DPIMIO_BUILD_TESTS=OFF

      - name: Build app
        run: cmake --build --preset default --target pimio_app

      - name: Stage deployment
        run: >-
          cmake --install build/default
          --prefix "${{ github.workspace }}/deploy"

      - name: Copy LORE library to deployment (Linux)
        if: matrix.name == 'Linux'
        run: |
          LORE_LIB=$(sed -n 's/^library=//p' build/default/lore-acquired.txt)
          [ -n "$LORE_LIB" ] && cp "$LORE_LIB" deploy/bin/

      - name: Copy Linux graphics runtime libraries to deployment
        if: matrix.name == 'Linux'
        run: |
          set -euo pipefail
          mkdir -p deploy/lib
          runtime_scan_paths=(deploy/bin)
          for path in deploy/lib deploy/plugins deploy/qml; do
            [ -e "$path" ] && runtime_scan_paths+=("$path")
          done
          mapfile -d '' -t runtime_candidates < <(find "${runtime_scan_paths[@]}" -type f \( -executable -o -name '*.so*' \) -print0)
          runtime_inputs=()
          for candidate in "${runtime_candidates[@]}"; do
            if file -b "$candidate" | grep -q '^ELF '; then
              runtime_inputs+=("$candidate")
            fi
          done
          mapfile -t runtime_libs < <(
            {
              for input in "${runtime_inputs[@]}"; do
                if ! ldd "$input"; then
                  echo "Failed to analyze runtime dependencies for: $input" >&2
                  exit 1
                fi
              done
            } |
              grep -E '=> /(lib|usr/lib)/' |
              awk '{ print $3 }' |
              while read -r lib; do
                case "$(basename "$lib")" in
                  libEGL.so.1|libGLX.so.0|libGLdispatch.so.0|libOpenGL.so.0|\
                  libX11-xcb.so.1|libX11.so.6|libXau.so.6|libXdmcp.so.6|\
                  libxcb.so.1|libxcb-*.so.*|libxkbcommon.so.0|libxkbcommon-x11.so.0)
                    printf '%s\n' "$lib"
                    ;;
                esac
              done |
              sort -u
          )
          for lib in "${runtime_libs[@]}"; do
            echo "Copying runtime library: $lib"
            cp -L "$lib" deploy/lib/
          done

      - name: Copy LORE library to deployment (macOS)
        if: matrix.name == 'macOS'
        run: |
          LORE_LIB=$(sed -n 's/^library=//p' build/default/lore-acquired.txt)
          [ -n "$LORE_LIB" ] && cp "$LORE_LIB" deploy/pimio.app/Contents/MacOS/

      - name: Copy LORE library to deployment (Windows)
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $lorePath = (Get-Content build/default/lore-acquired.txt |
            Where-Object { $_ -match '^library=' }) -replace '^library=', ''
          if ($lorePath) { Copy-Item $lorePath deploy/bin/ }

      - name: Archive deployment (Linux and macOS)
        if: matrix.archive == 'tar.gz'
        run: >-
          tar -C deploy -czf
          "pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.tar.gz"
          .

      - name: Archive deployment (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Push-Location deploy
          $archivePaths = @('bin/*')
          # Include any Windows runtime directories that the Qt deploy step created.
          $archivePaths += @('lib', 'plugins', 'qml', 'translations') | Where-Object { Test-Path $_ }
          Compress-Archive -Path $archivePaths -DestinationPath ../pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.zip
          Pop-Location

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-archive-${{ matrix.name }}
          path: pimio-${{ github.ref_name }}-${{ runner.os }}-binaries.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download binary archives
        uses: actions/download-artifact@v5
        with:
          path: .
          pattern: binary-archive-*
          merge-multiple: true

      - name: Create source snapshot asset
        run: >-
          git archive
          --format=tar.gz
          --output "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
          "${{ github.ref_name }}"

      - name: Create release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --verify-tag \
              --generate-notes \
              --title "${{ github.ref_name }}" \
              --prerelease
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          --clobber
          "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
          "pimio-${{ github.ref_name }}-Linux-binaries.tar.gz"
          "pimio-${{ github.ref_name }}-Windows-binaries.zip"
          "pimio-${{ github.ref_name }}-macOS-binaries.tar.gz"
