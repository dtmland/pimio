name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create source snapshot asset
        run: >-
          git archive
          --format=tar.gz
          --output "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
          "${{ github.ref_name }}"

      - name: Create release with autogenerated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          --verify-tag
          --generate-notes
          --title "${{ github.ref_name }}"

      - name: Upload source snapshot asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          "pimio-${{ github.ref_name }}-source-snapshot.tar.gz"
